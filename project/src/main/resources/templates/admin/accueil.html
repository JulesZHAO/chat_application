<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">

<head>
    <title>Accueil - Liste des utilisateurs</title>
</head>

<body>

    <!-- Tout ce qui est dans ce bloc va remplacer la balise <main> du layout.html -->
    <main>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Liste des utilisateurs</h3>

            <!-- Barre de recherche -->
            <form th:action="@{/admin}" method="get" class="d-flex w-50">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control me-2"
                    placeholder="Rechercher un nom, prénom, email...">
                <button type="submit" class="btn btn-outline-primary">Chercher</button>
                <!-- Bouton pour annuler la recherche, affiché seulement si on a cherché quelque chose -->
                <a th:if="${!keyword.isEmpty()}" th:href="@{/admin}" class="btn btn-outline-secondary ms-2"
                    title="Effacer la recherche">X</a>
            </form>

            <!-- Lien vers le formulaire d'ajout -->
            <a th:href="@{/admin/users/add}" class="btn btn-success">+ Nouveau</a>
        </div>

        <!-- Tableau Bootstrap pour afficher les données -->
        <table class="table table-striped border">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Boucle Thymeleaf : génère une ligne <tr> pour chaque utilisateur dans la base -->
                <tr th:each="user : ${utilisateurs}">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.nom}">Dupont</td>
                    <td th:text="${user.prenom}">Jean</td>
                    <td th:text="${user.email}">jean.dupont@mail.com</td>

                    <td th:text="${user.admin ? 'Admin' : 'Utilisateur'}">Utilisateur</td>

                    <td>
                        <span th:if="${user.actif}" class="badge bg-success">Actif</span>
                        <span th:unless="${user.actif}" class="badge bg-danger">Désactivé</span>
                    </td>

                    <td>
                        <a th:href="@{/admin/users/editer/{id}(id=${user.id})}"
                            class="btn btn-sm btn-primary">Éditer</a>
                        <a th:if="${user.isActif}" th:href="@{/admin/users/desactiver/{id}(id=${user.id})}"
                            class="btn btn-sm btn-warning">Désactiver</a>
                    </td>
                </tr>

                <!-- Message si la base de données est vide -->
                <tr th:if="${#lists.isEmpty(utilisateurs)}">
                    <td colspan="7" class="text-center text-muted">Aucun utilisateur trouvé.</td>
                </tr>
            </tbody>
        </table>

        <!-- Système de pagination Bootstrap -->
        <nav th:if="${totalPages > 0}" aria-label="Navigation des pages" class="mt-auto pt-3">
            <ul class="pagination justify-content-center mb-0">

                <!-- Bouton Précédent -->
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin(page=${currentPage - 1}, keyword=${keyword})}">Précédent</a>
                </li>

                <!-- Numéros de page -->
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/admin(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>

                <!-- Bouton Suivant -->
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin(page=${currentPage + 1}, keyword=${keyword})}">Suivant</a>
                </li>

            </ul>
        </nav>

    </main>

</body>

</html>
