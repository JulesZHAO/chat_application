<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::main})}">

<head>
    <title>Nouveau Utilisateur</title>
</head>

<body>

    <main>
        <h3>Ajouter un nouvel utilisateur</h3>
        <hr>

        <!-- Le formulaire est lié à l'objet "utilisateur" envoyé par le contrôleur -->
        <form th:action="@{/admin/users/add}" th:object="${utilisateur}" method="post" id="form-ajout-user">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" th:field="*{nom}" id="nom" required minlength="2"
                        maxlength="50">
                    <div class="invalid-feedback" id="nom-error">Le nom ne doit contenir que des lettres.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Prénom</label>
                    <input type="text" class="form-control" th:field="*{prenom}" id="prenom" required minlength="2"
                        maxlength="50">
                    <div class="invalid-feedback" id="prenom-error">Le prénom ne doit contenir que des lettres.</div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Adresse Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <div class="input-group">
                    <input type="text" class="form-control" th:field="*{motDePasse}" id="motDePasse" required
                        minlength="8">
                    <!-- Bouton pour générer le mot de passe aléatoire -->
                    <button class="btn btn-outline-secondary" type="button"
                        onclick="genererMotDePasse()">Générer</button>
                </div>
                <small class="form-text text-muted">8 caractères min, 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère
                    spécial.</small>
                <div class="text-danger mt-1" id="mdp-error" style="display: none; font-size: 0.875em;">Format du mot de
                    passe invalide.</div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" th:field="*{admin}" id="isAdmin">
                <label class="form-check-label" for="isAdmin">Cet utilisateur a les droits d'administration</label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Enregistrer</button>
                <a th:href="@{/admin}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>

        <!-- Chargement du script de validation -->
        <script th:src="@{/js/add-user.js}"></script>
    </main>

</body>

</html>
