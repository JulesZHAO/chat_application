<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::main})}" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Éditer un Utilisateur</title>
</head>

<body>

    <main>
        <h3>Modifier l'utilisateur</h3>
        <hr>

        <!-- On garde id="form-ajout-user" pour que le fichier JS de validation fonctionne automatiquement ici aussi -->
        <form th:action="@{/admin/users/editer/{id}(id=${utilisateur.id})}" th:object="${utilisateur}" method="post"
            id="form-ajout-user">

            <!-- On utilise des champs cachés pour ne pas perdre les infos lors de la soumission -->
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{actif}">

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <input type="text" class="form-control" th:field="*{nom}" id="nom" required minlength="2"
                        maxlength="50">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Prénom</label>
                    <input type="text" class="form-control" th:field="*{prenom}" id="prenom" required minlength="2"
                        maxlength="50">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Adresse Email</label>
                <input type="email" class="form-control" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <div class="input-group">
                    <input type="text" class="form-control" th:field="*{motDePasse}" id="motDePasse" required
                        minlength="8">
                    <button class="btn btn-outline-secondary" type="button" id="btn-generer">Générer</button>
                </div>
                <small class="form-text text-muted">Modifier ce champ changera le mot de passe de l'utilisateur.</small>
                <div class="text-danger mt-1" id="mdp-error" style="display: none; font-size: 0.875em;">Format du mot de
                    passe invalide.</div>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" th:field="*{admin}" id="isAdmin">
                <label class="form-check-label" for="isAdmin">Cet utilisateur a les droits d'administration</label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Mettre à jour</button>
                <a th:href="@{/admin}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>

        <!-- On réutilise exactement le même script de validation que dans add-user.html -->
        <script th:src="@{/js/admin/add-user-validation.js}"></script>
    </main>

</body>

</html>
